<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a12"/>
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.4"/>

  <!-- Castle body -->
  <rect x="16" y="30" width="32" height="24" rx="1" fill="#ffd700" opacity="0.95"/>

  <!-- Castle gate (arch) -->
  <rect x="26" y="42" width="12" height="12" fill="#0a0a12"/>
  <ellipse cx="32" cy="42" rx="6" ry="4" fill="#0a0a12"/>

  <!-- Window left -->
  <rect x="19" y="35" width="5" height="6" rx="1" fill="#0a0a12" opacity="0.8"/>
  <!-- Window right -->
  <rect x="40" y="35" width="5" height="6" rx="1" fill="#0a0a12" opacity="0.8"/>

  <!-- Center tower -->
  <rect x="25" y="18" width="14" height="16" rx="1" fill="#ffd700"/>
  <!-- Center tower window -->
  <rect x="29" y="22" width="6" height="7" rx="1" fill="#0a0a12" opacity="0.85"/>

  <!-- Left tower -->
  <rect x="12" y="24" width="10" height="14" rx="1" fill="#ffd700" opacity="0.9"/>
  <!-- Right tower -->
  <rect x="42" y="24" width="10" height="14" rx="1" fill="#ffd700" opacity="0.9"/>

  <!-- Battlements: center tower -->
  <rect x="25" y="14" width="3" height="5" rx="0.5" fill="#ffd700"/>
  <rect x="30" y="14" width="3" height="5" rx="0.5" fill="#ffd700"/>
  <rect x="36" y="14" width="3" height="5" rx="0.5" fill="#ffd700"/>

  <!-- Battlements: left tower -->
  <rect x="12" y="20" width="2.5" height="4" rx="0.5" fill="#ffd700" opacity="0.9"/>
  <rect x="16" y="20" width="2.5" height="4" rx="0.5" fill="#ffd700" opacity="0.9"/>

  <!-- Battlements: right tower -->
  <rect x="42" y="20" width="2.5" height="4" rx="0.5" fill="#ffd700" opacity="0.9"/>
  <rect x="46" y="20" width="2.5" height="4" rx="0.5" fill="#ffd700" opacity="0.9"/>

  <!-- Battlements: main wall -->
  <rect x="16" y="26" width="3" height="5" rx="0.5" fill="#ffd700" opacity="0.9"/>
  <rect x="45" y="26" width="3" height="5" rx="0.5" fill="#ffd700" opacity="0.9"/>

  <!-- Flag pole & flag -->
  <rect x="31.5" y="6" width="1.5" height="9" fill="#ffd700"/>
  <polygon points="33,6 33,12 40,9" fill="#c0392b"/>

  <!-- Gold glow at bottom -->
  <rect x="16" y="52" width="32" height="2" rx="1" fill="#ffd700" opacity="0.3"/>
</svg>
